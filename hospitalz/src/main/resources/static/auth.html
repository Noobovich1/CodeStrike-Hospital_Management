<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hospitalz - Login</title>
    <link rel="stylesheet" href="css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      .login-container {
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg-primary);
        padding: 16px;
      }
      .login-box {
        width: 100%;
        max-width: 400px;
        padding: 40px;
      }
      .form-group {
        margin-bottom: 20px;
      }
      input {
        width: 100%;
        padding: 12px;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        margin-top: 8px;
      }
      button {
        width: 100%;
        padding: 12px;
        background: var(--accent-primary);
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
      }
      #theme-toggle {
        position: absolute;
        top: 24px;
        right: 24px;
        background: var(--bg-secondary);
        border: 1px solid var(--border-color);
        width: 40px;
        height: 40px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        color: var(--text-primary);
        box-shadow: var(--shadow-md);
        transition: all 0.2s ease;
        z-index: 1000;
      }
      #theme-toggle:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 16px rgba(0,0,0,0.15);
        color: var(--accent-primary);
      }
    </style>
  </head>
  <body>
    <button id="theme-toggle" title="Toggle Theme">
      <i class="fa-solid fa-moon"></i>
    </button>
    <div class="login-container">
      <div class="glass-panel login-box">
        <h2 style="text-align: center; margin-bottom: 30px">Hospitalz Login</h2>
        <div
          id="error-msg"
          style="color: red; margin-bottom: 10px; display: none"
        ></div>
        <form id="login-form">
          <div class="form-group">
            <label>Username</label>
            <input
              type="text"
              id="username"
              required
              placeholder="admin_system"
            />
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" required placeholder="pass" />
          </div>
          <div class="form-group" style="display: flex; align-items: center; gap: 8px; margin-top: 10px; margin-bottom: 20px;">
            <input type="checkbox" id="rememberMe" style="width: auto; margin-top: 0; cursor: pointer;" />
            <label for="rememberMe" style="cursor: pointer; user-select: none;">Remember me</label>
          </div>
          <button type="submit">Login</button>
        </form>
      </div>
    </div>

    <script>
      // Theme Management for Auth Page
      const savedTheme = localStorage.getItem("theme") || "light";
      document.documentElement.setAttribute("data-theme", savedTheme);

      function updateThemeIcon(theme) {
        const icon = document.querySelector("#theme-toggle i");
        if (icon) {
          if (theme === "dark") {
            icon.className = "fa-solid fa-sun";
          } else {
            icon.className = "fa-solid fa-moon";
          }
        }
      }

      // Initialize icon on page load
      updateThemeIcon(savedTheme);

      document.getElementById("theme-toggle").addEventListener("click", () => {
        const currentTheme = document.documentElement.getAttribute("data-theme");
        const newTheme = currentTheme === "dark" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", newTheme);
        localStorage.setItem("theme", newTheme);
        updateThemeIcon(newTheme);
      });

      if (localStorage.getItem("token") || sessionStorage.getItem("token")) {
        window.location.href = "/index.html";
      }

      document
        .getElementById("login-form")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const username = document.getElementById("username").value;
          const password = document.getElementById("password").value;
          const rememberMe = document.getElementById("rememberMe").checked;

          try {
            const response = await fetch("/api/v1/auth/login", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ username, password, rememberMe }),
            });

            if (response.ok) {
              const data = await response.json();
              
              // Select storage based on rememberMe
              const storage = rememberMe ? localStorage : sessionStorage;

              // Clear old tokens to avoid conflict
              localStorage.removeItem("token");
              localStorage.removeItem("role");
              localStorage.removeItem("username");
              localStorage.removeItem("doctorId");
              sessionStorage.removeItem("token");
              sessionStorage.removeItem("role");
              sessionStorage.removeItem("username");
              sessionStorage.removeItem("doctorId");

              // Save to selected storage
              storage.setItem("token", data.token);
              storage.setItem("role", data.role);
              storage.setItem("username", data.username);
              if (data.doctorId) {
                storage.setItem("doctorId", data.doctorId);
              }
              // Chuyển hướng về trang chủ
              window.location.href = "/index.html";
            } else {
              document.getElementById("error-msg").innerText =
                "Wrong username or password!";
              document.getElementById("error-msg").style.display = "block";
            }
          } catch (err) {
            console.error(err);
          }
        });
    </script>
  </body>
</html>
